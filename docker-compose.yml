services:
  vendor-agnostic-rl:
    build:
      context: .
      dockerfile: Dockerfile
    image: vendor-agnostic-rl:latest
    container_name: vendor-agnostic-rl
    working_dir: /workspace
    ipc: host
    shm_size: '8gb'
    volumes:
      - .:/workspace
    environment:
      MUJOCO_GL: ${MUJOCO_GL:-egl}
      PYOPENGL_PLATFORM: ${PYOPENGL_PLATFORM:-egl}
      XLA_PYTHON_CLIENT_PREALLOCATE: ${XLA_PYTHON_CLIENT_PREALLOCATE:-false}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    tty: true
    stdin_open: true
    command: bash

  vendor-agnostic-rl-train:
    build:
      context: .
      dockerfile: Dockerfile
    image: vendor-agnostic-rl:latest
    container_name: vendor-agnostic-rl-train
    working_dir: /workspace
    ipc: host
    shm_size: '8gb'
    volumes:
      - .:/workspace
    environment:
      MUJOCO_GL: ${MUJOCO_GL:-egl}
      PYOPENGL_PLATFORM: ${PYOPENGL_PLATFORM:-egl}
      # BFC pre-allocation with cap — grabs one contiguous pool upfront,
      # avoids repeated hipMalloc calls that cross GCD aperture boundaries.
      XLA_PYTHON_CLIENT_PREALLOCATE: "true"
      XLA_PYTHON_CLIENT_MEM_FRACTION: "0.85"
      # ROCm stability: polling completion avoids null kernarg/signal dispatch bug
      HSA_ENABLE_INTERRUPT: "0"
      # Restrict JAX to a single GPU — 9 DRI cards visible but only 1 MI300X
      ROCR_VISIBLE_DEVICES: "0"
      HIP_VISIBLE_DEVICES: "0"
      # Prevent concurrent dispatch races on same HW queue
      GPU_MAX_HW_QUEUES: "1"
      # Disable command buffer replay (hipGraph zeroes AQL setup field on MI300X).
      # This flag is an enum, not a bool — empty string disables all modes.
      XLA_FLAGS: "--xla_gpu_enable_command_buffer="
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    # Required for ROCm to lock GPU memory pages inside Docker
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    tty: false
    stdin_open: false
    command: ["bash", "tools/run_pipeline.sh"]

  vendor-agnostic-rl-nvidia:
    build:
      context: .
      dockerfile: Dockerfile.nvidia
    image: vendor-agnostic-rl-nvidia:latest
    container_name: vendor-agnostic-rl-nvidia
    working_dir: /workspace
    ipc: host
    shm_size: '8gb'
    volumes:
      - .:/workspace
    environment:
      MUJOCO_GL: ${MUJOCO_GL:-egl}
      PYOPENGL_PLATFORM: ${PYOPENGL_PLATFORM:-egl}
      XLA_PYTHON_CLIENT_PREALLOCATE: ${XLA_PYTHON_CLIENT_PREALLOCATE:-false}
      CUDA_VISIBLE_DEVICES: "0"
    runtime: nvidia
    tty: true
    stdin_open: true
    command: bash

  vendor-agnostic-rl-train-nvidia:
    build:
      context: .
      dockerfile: Dockerfile.nvidia
    image: vendor-agnostic-rl-nvidia:latest
    container_name: vendor-agnostic-rl-train-nvidia
    working_dir: /workspace
    ipc: host
    shm_size: '8gb'
    volumes:
      - .:/workspace
    environment:
      MUJOCO_GL: ${MUJOCO_GL:-egl}
      PYOPENGL_PLATFORM: ${PYOPENGL_PLATFORM:-egl}
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      # platform allocator avoids BFC pre-grab on unknown VRAM size
      XLA_PYTHON_CLIENT_ALLOCATOR: "platform"
      CUDA_VISIBLE_DEVICES: "0"
    runtime: nvidia
    tty: false
    stdin_open: false
    command: ["python", "-m", "rl.cli", "--config", "configs/ppo_vendor_tuned.json", "--backend", "brax", "--terrain", "flat"]
