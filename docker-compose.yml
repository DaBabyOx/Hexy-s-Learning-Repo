services:
  vendor-agnostic-rl:
    build:
      context: .
      dockerfile: Dockerfile
    image: vendor-agnostic-rl:latest
    container_name: vendor-agnostic-rl
    working_dir: /workspace
    ipc: host
    shm_size: '8gb'
    volumes:
      - .:/workspace
    environment:
      MUJOCO_GL: ${MUJOCO_GL:-egl}
      PYOPENGL_PLATFORM: ${PYOPENGL_PLATFORM:-egl}
      XLA_PYTHON_CLIENT_PREALLOCATE: ${XLA_PYTHON_CLIENT_PREALLOCATE:-false}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    tty: true
    stdin_open: true
    command: bash

  vendor-agnostic-rl-train:
    build:
      context: .
      dockerfile: Dockerfile
    image: vendor-agnostic-rl:latest
    container_name: vendor-agnostic-rl-train
    working_dir: /workspace
    ipc: host
    shm_size: '8gb'
    volumes:
      - .:/workspace
    environment:
      MUJOCO_GL: ${MUJOCO_GL:-egl}
      PYOPENGL_PLATFORM: ${PYOPENGL_PLATFORM:-egl}
      XLA_PYTHON_CLIENT_PREALLOCATE: ${XLA_PYTHON_CLIENT_PREALLOCATE:-false}
      # ROCm stability: polling completion avoids null kernarg/signal dispatch bug
      HSA_ENABLE_INTERRUPT: "0"
      # Restrict JAX to a single GPU — 9 DRI cards visible but only 1 MI300X
      ROCR_VISIBLE_DEVICES: "0"
      HIP_VISIBLE_DEVICES: "0"
      # Platform allocator: direct hipMalloc instead of BFC caching allocator.
      XLA_PYTHON_CLIENT_ALLOCATOR: "platform"
      # Disable XLA command buffers (ROCm graph replay).
      # When enabled, XLA records kernels via hipGraph and replays them;
      # on MI300X the replay zeroes the AQL packet 'setup' field (dimensions),
      # causing HSA_STATUS_ERROR_MEMORY_APERTURE_VIOLATION in fused scan kernels.
      XLA_FLAGS: "--xla_gpu_enable_command_buffer="
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    # Required for ROCm to lock GPU memory pages inside Docker
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    tty: false
    stdin_open: false
    command: ["bash", "tools/run_pipeline.sh"]
